<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Save Sao Miguel!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    height: 100%;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    height: 100%;
    min-height: 100dvh;
    background: linear-gradient(#1a1a2e, #16213e);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    image-rendering: pixelated;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    gap: 10px;
  }
  #game-container {
    position: relative;
    width: min(480px, 96vw);
    aspect-ratio: 480 / 270;
    touch-action: none;
    flex-shrink: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #6ec6ff;
    border: 4px solid #2c2c54;
    border-radius: 4px;
    image-rendering: pixelated;
    touch-action: none;
  }
  /* Op iPhone in liggende stand vult het spel het scherm veel beter dan een klein vast blokje */
  @media (orientation: landscape) {
    body { padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); gap: 6px; }
    #game-container { width: min(96vw, calc(92dvh * 480 / 270)); }
    #hint { font-size: 10px; }
  }
  /* Vol scherm i.p.v. vastgeplakt aan het kleine 16:9 canvasje -- zo is er altijd
     genoeg ruimte voor het personage en de tekst, ook op een smalle iPhone. */
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,10,30,0.92);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    z-index: 20;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  /* Dialoogscherm: Amina/Kikker staan er levensecht bij, alsof ze zelf tegen je praten */
  #overlay.dialogue-mode {
    background:
      linear-gradient(rgba(8,10,25,0.55), rgba(8,10,25,0.72)),
      linear-gradient(180deg, #ffd89b 0%, #87ceeb 55%, #3a7bd5 100%);
    padding: 6% 4% 6% 40%;
  }
  .dialogue-char {
    position: absolute;
    left: 1%;
    bottom: 0;
    width: 38%;
    height: auto;
    max-height: 70%;
    z-index: 5;
    filter: drop-shadow(3px 4px 3px rgba(0,0,0,0.35));
    pointer-events: none;
  }
  .dialogue-char.amina { width: 17%; }
  .speaker {
    color: #7fffd4;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 4px;
    letter-spacing: 1px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
  }
  .line {
    font-size: 14px;
    line-height: 1.45;
    margin-bottom: 14px;
    max-width: 255px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
  }
  button {
    background: #ff6b6b;
    color: #fff;
    border: 3px solid #c0392b;
    padding: 12px 26px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    letter-spacing: 1px;
    touch-action: manipulation;
    position: relative;
    z-index: 6;
  }
  button:hover, button:active { background: #ff8787; }
  #hud {
    position: absolute;
    top: 10px; left: 10px;
    color: #fff;
    font-size: 13px;
    text-shadow: 2px 2px 0 #000;
    font-weight: bold;
    pointer-events: none;
  }
  #hint {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .end-avatar {
    width: min(230px, 58vw);
    height: auto;
    image-rendering: auto;
    margin-bottom: 8px;
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }
  .fail-heading {
    color: #ff8787;
    font-weight: bold;
    font-size: 16px;
    letter-spacing: 0.5px;
  }
  /* Zachte suggestie om het toestel te draaien -- alleen op telefoons in staande stand, wegklikbaar */
  #rotate-hint {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #0a0a1e;
    color: #fff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 14px;
    font-family: 'Courier New', monospace;
  }
  #rotate-hint .icon { font-size: 46px; display: inline-block; animation: rotateHintSpin 1.8s ease-in-out infinite; }
  @keyframes rotateHintSpin {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }
  #rotate-hint p { max-width: 280px; font-size: 14px; line-height: 1.5; }
  #rotate-hint button {
    background: transparent;
    border: 2px solid #7fffd4;
    color: #7fffd4;
    font-size: 13px;
    padding: 10px 18px;
  }
  #rotate-hint button:hover, #rotate-hint button:active { background: rgba(127,255,212,0.15); }
  @media (orientation: portrait) and (pointer: coarse) {
    body:not(.hide-rotate-hint) #rotate-hint { display: flex; }
  }
</style>
</head>
<body>

<div id="rotate-hint">
  <div class="icon">📱</div>
  <p>Draai je toestel liggend voor de beste speelervaring!</p>
  <button id="rotate-dismiss">Toch verder spelen</button>
</div>

<div id="game-container">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="hud"></div>
  <div id="overlay" class="dialogue-mode">
    <img class="dialogue-char" src="PIXELART/kikker.png" alt="KIKKER">
    <div class="speaker">KIKKER</div>
    <div class="line">"HELP!! Sinds jou laatste vertrek is er chaos op Sao Miguel. De heilige dam is gebroken en het eiland dreigt elk moment onder te lopen. Kun jij ons redden?"</div>
    <button id="next-btn">Verder ▶</button>
  </div>
</div>
<div id="hint">TIK op het scherm om te springen</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const hud = document.getElementById('hud');
const gameContainer = document.getElementById('game-container');
ctx.imageSmoothingEnabled = false;

// ---- Wegklikbare "draai je toestel"-hint (onthouden voor deze sessie) ----
const rotateHint = document.getElementById('rotate-hint');
if (sessionStorage.getItem('aminaSkipRotateHint') === '1') {
  document.body.classList.add('hide-rotate-hint');
}
document.getElementById('rotate-dismiss').addEventListener('click', () => {
  document.body.classList.add('hide-rotate-hint');
  sessionStorage.setItem('aminaSkipRotateHint', '1');
});

// ---- Geluidseffecten ----
function makeAudio(src) {
  const a = new Audio(src);
  a.preload = 'auto';
  return a;
}
const SND = {
  buttonClick: makeAudio('SFX/Button%20Click.wav'),
  aminaTalking: makeAudio('SFX/Amina%20talking.wav'),
  frogTalking: makeAudio('SFX/Frog%20talking.wav'),
  gameOver: makeAudio('SFX/Game%20over.wav'),
  jumpSfx: makeAudio('SFX/Jump.wav'),
  messagePopup: makeAudio('SFX/Message%20PopUp.wav')
};
function playSound(a) {
  try {
    a.currentTime = 0;
    a.play().catch(() => {});
  } catch (e) {}
}

// ---- Zeilgeluid tijdens het varen + gejuich bij het halen van het eiland
// (geen achtergrondmuziek meer -- gaf glitches) ----
const SAILING = makeAudio('SFX/SAILING_SFX.mp3');
SAILING.loop = true; SAILING.volume = 0.45;
const CHEER = makeAudio('SFX/Cheer.mp3');
CHEER.volume = 0.85;

function playSailing() {
  SAILING.currentTime = 0;
  SAILING.play().catch(() => {});
}
function stopSailing() { SAILING.pause(); }

// iOS/Safari houdt elk <audio>-element apart op slot totdat het minstens
// één keer is afgespeeld tijdens een echte tik van de gebruiker. Alles wordt
// bij de allereerste tik op de pagina ontgrendeld, zodat geluiden die later
// vanuit de spellogica komen (bv. game-over) ook gegarandeerd werken. Gedempt
// afspelen zodat je bij die eerste tik geen flits van geluid hoort.
let audioUnlocked = false;
function unlockAllAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  [...Object.values(SND), SAILING, CHEER].forEach((a) => {
    const wasMuted = a.muted;
    a.muted = true;
    a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = wasMuted; }).catch(() => { a.muted = wasMuted; });
  });
}
document.addEventListener('touchstart', unlockAllAudio, { once: true, passive: true });
document.addEventListener('click', unlockAllAudio, { once: true });

// ---- Personage-sprites ----
const aminaRightImg = new Image();
let aminaRightLoaded = false;
aminaRightImg.onload = () => { aminaRightLoaded = true; if (!running) draw(); };
aminaRightImg.src = 'PIXELART/amina-right.png';

// Prevent iOS rubber-band scroll / pinch while playing (scoped to the game area)
gameContainer.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

// ---- Dialogue sequence ----
const dialogue = [
  { speaker: 'KIKKER', text: '"HELP!! Sinds jou laatste vertrek is er chaos op Sao Miguel. De heilige dam is gebroken en het eiland dreigt elk moment onder te lopen. Kun jij ons redden?"' },
  { speaker: 'AMINA', text: '"OMG, ik wist dat ik te snel was vertrokken. Ik kom er meteen aan!"' },
  { speaker: 'KIKKER', text: '"Kwak..."' },
  { speaker: 'KIKKER', text: '"Oke, er staat een zeilboot vlak bij jou aan de kaai. Neem hem en kwak tot ons toe. Maar let op! De weg is verspreid met Hennessy flessen. Trap er niet in! Succes!"' }
];
let dIndex = 0;

function renderDialogue() {
  overlay.classList.add('dialogue-mode');
  const d = dialogue[dIndex];
  const isAmina = d.speaker === 'AMINA';
  playSound(SND.messagePopup);
  playSound(isAmina ? SND.aminaTalking : SND.frogTalking);
  const charSrc = isAmina ? 'PIXELART/amina-front.png' : 'PIXELART/kikker.png';
  const charClass = isAmina ? 'dialogue-char amina' : 'dialogue-char';
  overlay.innerHTML = `
    <img class="${charClass}" src="${charSrc}" alt="${d.speaker}">
    <div class="speaker">${d.speaker}</div>
    <div class="line">${d.text}</div>
    <button id="next-btn">${dIndex < dialogue.length - 1 ? 'Verder ▶' : 'Start de reddingsactie! ⛵'}</button>
  `;
  document.getElementById('next-btn').addEventListener('touchend', (e) => {
    e.preventDefault(); e.stopPropagation();
    advanceDialogue();
  });
  document.getElementById('next-btn').addEventListener('click', advanceDialogue);
}

function advanceDialogue() {
  playSound(SND.buttonClick);
  dIndex++;
  if (dIndex < dialogue.length) {
    renderDialogue();
  } else {
    startGame();
  }
}
renderDialogue();

// ---- Game state ----
let running = false;
let gameOver = false;
let won = false;
let score = 0;
let speed = 3.2;
const WIN_SCORE = 400;

const boat = {
  x: 70, y: 190, w: 34, h: 26,
  vy: 0, grounded: true, jumpPower: -7.6, gravity: 0.42
};
const waterLevel = 216;

let obstacles = [];
let waveOffset = 0;

// Max 3 flessen, op verschillende afstanden van elkaar (score-afstand tot volgende spawn)
const bottleSpawnScores = [70, 170, 330];
let nextBottleIndex = 0;

// Het eiland: verschijnt pas nadat de laatste fles voorbij is, en de missie
// is voltooid zodra het bootje het bereikt (niet langer op basis van score alleen)
const ISLAND_W = 96, ISLAND_H = 56;
let island = null;
let islandTriggerScore = null;

function resetGame() {
  score = 0; speed = 2.6; obstacles = []; nextBottleIndex = 0;
  island = null; islandTriggerScore = null;
  boat.y = 190; boat.vy = 0; boat.grounded = true;
  gameOver = false; won = false;
}

function startGame() {
  overlay.classList.remove('dialogue-mode');
  overlay.style.display = 'none';
  resetGame();
  running = true;
  playSailing();
  requestAnimationFrame(loop);
}

function jump() {
  if (!running) return;
  if (gameOver || won) return;
  if (boat.grounded) {
    boat.vy = boat.jumpPower;
    boat.grounded = false;
    playSound(SND.jumpSfx);
  }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); jump(); }
});

// Use the whole container for touch/click so it's easy to hit on iPhone
gameContainer.addEventListener('touchstart', (e) => {
  e.preventDefault();
  jump();
}, { passive: false });
gameContainer.addEventListener('mousedown', jump);

// ---- Pixel drawing helpers ----
function pixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function drawBoat(x, y) {
  pixelRect(x, y+16, 34, 8, '#8b5a2b');
  pixelRect(x+2, y+22, 30, 4, '#6b3f1d');
  pixelRect(x+15, y-14, 2, 30, '#4a2c17');
  ctx.fillStyle = '#f5f0e6';
  ctx.beginPath();
  ctx.moveTo(x+17, y-12);
  ctx.lineTo(x+17, y+12);
  ctx.lineTo(x+32, y+10);
  ctx.closePath();
  ctx.fill();
  // Amina, aan het roer
  if (aminaRightLoaded) {
    const charH = 34;
    const charW = charH * (aminaRightImg.naturalWidth / aminaRightImg.naturalHeight);
    ctx.drawImage(aminaRightImg, x + 2, y - 22, charW, charH);
  } else {
    pixelRect(x+6, y+2, 8, 10, '#e0a877');
    pixelRect(x+6, y-4, 8, 8, '#3a2a1a');
    pixelRect(x+7, y+12, 6, 4, '#d9534f');
  }
}

function drawBottle(x, y) {
  pixelRect(x+4, y, 4, 6, '#2e7d32');
  pixelRect(x+2, y+6, 8, 16, '#1b5e20');
  pixelRect(x+2, y+8, 8, 3, '#c8e6c9');
  pixelRect(x+3, y-2, 2, 3, '#8d6e63');
}

function drawWater() {
  ctx.fillStyle = '#3a7bd5';
  ctx.fillRect(0, waterLevel, canvas.width, canvas.height - waterLevel);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    const yy = waterLevel + 10 + i * 12;
    for (let x = -20; x < canvas.width + 20; x += 20) {
      const wy = yy + Math.sin((x + waveOffset + i*30) * 0.05) * 3;
      if (x === -20) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
    }
    ctx.stroke();
  }
}

function drawSky() {
  const grad = ctx.createLinearGradient(0,0,0,waterLevel);
  grad.addColorStop(0, '#ffd89b');
  grad.addColorStop(1, '#87ceeb');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,canvas.width, waterLevel);
  pixelRect(390, 20, 24, 24, '#fff176');
  ctx.fillStyle = 'rgba(60,80,60,0.5)';
  ctx.beginPath();
  ctx.moveTo(canvas.width-10, waterLevel);
  ctx.lineTo(canvas.width-60, waterLevel-30);
  ctx.lineTo(canvas.width-100, waterLevel-15);
  ctx.lineTo(canvas.width-140, waterLevel-35);
  ctx.lineTo(canvas.width-170, waterLevel);
  ctx.closePath();
  ctx.fill();
}

function spawnObstacle() {
  obstacles.push({ x: canvas.width + 10, y: waterLevel - 20, w: 12, h: 22, hit: false });
}

function spawnIsland() {
  island = { x: canvas.width + 20, y: waterLevel - ISLAND_H };
}

function drawIsland(x, y) {
  const w = ISLAND_W, h = ISLAND_H;
  // zandstrand, raakt het water
  pixelRect(x, y + h - 16, w, 16, '#e6c988');
  pixelRect(x + w*0.15, y + h - 26, w*0.7, 12, '#d4b06a');
  // groene heuvel
  pixelRect(x + w*0.22, y + h*0.28, w*0.56, h*0.5, '#3f8f3f');
  pixelRect(x + w*0.3, y + h*0.1, w*0.4, h*0.24, '#2e7d32');
  // palmboom
  pixelRect(x + w - 22, y + 6, 4, 26, '#6b3f1d');
  pixelRect(x + w - 34, y - 6, 26, 12, '#2e7d32');
  pixelRect(x + w - 30, y - 12, 16, 8, '#388e3c');
}

function loop() {
  if (!running) return;
  update();
  draw();
  if (!gameOver && !won) requestAnimationFrame(loop);
}

function update() {
  waveOffset += speed;
  score += speed * 0.5;
  speed += 0.0015;

  boat.vy += boat.gravity;
  boat.y += boat.vy;
  if (boat.y >= 190) { boat.y = 190; boat.vy = 0; boat.grounded = true; }

  if (nextBottleIndex < bottleSpawnScores.length && score >= bottleSpawnScores[nextBottleIndex]) {
    spawnObstacle();
    nextBottleIndex++;
  }

  const boatBox = { x: boat.x+6, y: boat.y+4, w: 22, h: 20 };
  for (let ob of obstacles) {
    ob.x -= speed;
    const obBox = { x: ob.x, y: ob.y, w: ob.w, h: ob.h };
    if (rectsOverlap(boatBox, obBox)) {
      gameOver = true;
    }
  }
  obstacles = obstacles.filter(ob => ob.x > -20);

  // Het eiland verschijnt pas nadat de laatste fles ruim voorbij is
  if (nextBottleIndex >= bottleSpawnScores.length && islandTriggerScore === null) {
    islandTriggerScore = score + 140;
  }
  if (!island && islandTriggerScore !== null && score >= islandTriggerScore) {
    spawnIsland();
  }
  if (island) {
    island.x -= speed;
    if (island.x <= boatBox.x + boatBox.w) {
      won = true;
    }
  }

  hud.textContent = island
    ? 'Bijna bij het eiland! 🏝️'
    : `Afstand: ${Math.floor(score)} / ${WIN_SCORE}`;

  if (gameOver) showEnd(false);
  if (won) showEnd(true);
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function draw() {
  drawSky();
  drawWater();
  if (island) drawIsland(island.x, island.y);
  for (let ob of obstacles) drawBottle(ob.x, ob.y);
  drawBoat(boat.x, boat.y);
}

function showEnd(success) {
  running = false;
  overlay.classList.remove('dialogue-mode');
  overlay.style.display = 'flex';
  if (success) {
    stopSailing();
    playSound(SND.messagePopup);
    playSound(CHEER);
    overlay.innerHTML = `
      <img class="end-avatar" src="PIXELART/HUGGING_CHARACTERS.png" alt="Amina en Kikker vieren feest">
      <div class="speaker">KIKKER</div>
      <div class="line">Bedankt, held. Dankzij jou konden we ontsnappen.</div>
      <div class="line" style="font-style: italic; font-size: 12px;">"We hebben geen controle over de wind die ons tegemoetkomt, maar wel over hoe we onze zeilen zetten. Zo vinden we, ondanks elk obstakel, onze eigen koers."</div>
      <button id="retry-btn">Nog een keer spelen 🔁</button>
    `;
  } else {
    stopSailing();
    playSound(SND.gameOver);
    overlay.innerHTML = `
      <img class="end-avatar" src="PIXELART/Puking.png" alt="Amina is knock-out na de Hennessy">
      <div class="line fail-heading">SPHIJT, WE ZIJN AMINA KWIJT.</div>
      <div class="line">Amina botste tegen de Hennessy... de rest is history.</div>
      <button id="retry-btn">Probeer opnieuw 🔁</button>
    `;
  }
  document.getElementById('retry-btn').addEventListener('touchend', (e) => {
    e.preventDefault(); e.stopPropagation();
    playSound(SND.buttonClick);
    startGame();
  });
  document.getElementById('retry-btn').addEventListener('click', () => {
    playSound(SND.buttonClick);
    startGame();
  });
}

drawSky();
drawWater();
drawBoat(boat.x, boat.y);
</script>

</body>
</html>
